name: dicee
description: A new Flutter application.

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - images/
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "images/dice6.png"
  web:
    generate: true
    image_path: "images/dice6.png"
